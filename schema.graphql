"""
An organisation, the tenant of its members and, later, of its register. Its
`slug` names it in the UI at `/:slug`.
"""
type Organisation {
  city: String!
  """ISO 3166-1 alpha-2."""
  countryCode: String!
  createdAt: DateTime!
  id: ID!
  kind: OrganisationKind!
  name: String!
  slug: String!
  """When the platform granted the verified badge; null while unverified."""
  verifiedAt: DateTime
}

"""
What an organisation is: it sets its kind in its public page and the way it is found.
"""
enum OrganisationKind {
  HOTEL
  OTHER
  POLICE
  SCHOOL
  STATION
  TOWN_HALL
}

"""The viewer's place in one organisation."""
type OrganisationMembership {
  organisation: Organisation!
  role: OrganisationRole!
}

"""The role of a member inside one organisation."""
enum OrganisationRole {
  """An agent's rights, plus members, the public page and settings."""
  ADMIN
  """Works the register: intake, storage, handover, destruction."""
  AGENT
}

"""
Where a page of a list ends. Paging is forward only: `endCursor` is the
`after` of the next page; to go back, a client keeps the cursors it has
visited. `startCursor` is the `after` this page was asked with, and
`hasPreviousPage` says whether it was given.
"""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""A phone number in E.164 form, such as +33612345678."""
scalar PhoneNumber @specifiedBy(url: "https://www.itu.int/rec/T-REC-E.164")

"""A photo of the author's own listing: its media keys, never a URL."""
type Photo {
  """
  The strongly blurred copy visitors see instead, at
  `/media/listing-blurred/<key>`: set for an ID document's photo and for any
  photo the server's OCR found ID-like; null for a photo shown as it is.
  """
  blurredKey: ID
  """
  Read the bytes at `/media/listing-photos/<key>/full`: the author and the organisation's agents only for an ID document's photo.
  """
  key: ID!
  status: PhotoStatus!
}

enum PhotoStatus {
  """
  Not processed yet: the server's own OCR reads it, and blurs it when it is (or looks like) an ID document's.
  """
  PENDING
  """
  Processed: served by `/media/listing-photos/<key>/full` to the author, and to visitors through its blurred copy when it has one.
  """
  READY
}

"""
The roles an account holds over the platform. Every account is a `USER`; a
platform admin is a `MODERATOR` too. A role in an organisation is an
`OrganisationRole`, held through a membership.
"""
enum PlatformRole {
  """
  Named by the platform admin: reports, organisation verification, suspensions.
  """
  MODERATOR
  """
  The owner of the platform: a moderator's rights plus moderators and settings.
  """
  PLATFORM_ADMIN
  """A signed-in account: declares, claims, chats, reports."""
  USER
}

"""A TCP or UDP port number, from 0 to 65535."""
scalar Port

"""A finite number above 0."""
scalar PositiveFloat

"""An integer from 1 to 2147483647."""
scalar PositiveInt

"""
A listing as a visitor sees it, masked: no author, no exact private point, no
question or answer, no phone number, no original photo. For an ID document
(`documentType` set) there is no free text (`title`, `description` and
`attributes` are null, `photoKeys` empty): its type, its country, the masked
number, the holder hint and its photos blurred whole (`blurredPhotoKeys`).
"""
type PublicListing {
  attributes: ListingAttributes
  """
  The photos shown blurred whole (an ID document's, or any the server's OCR found ID-like), at `/media/listing-blurred/<key>`.
  """
  blurredPhotoKeys: [ID!]! @listSize(assumedSize: 5)
  categoryKey: String!
  countryCode: String!
  date: Date!
  description: String
  documentType: String
  expiresAt: DateTime
  """
  An ID document's holder, first name and last-name initial (`Jean E.`); null when none was read or for an object.
  """
  holderHint: String
  id: ID!
  kind: ListingKind!
  """
  An ID document's number, all but its first two characters masked (`99••••••••`); null when none was read or for an object.
  """
  maskedNumber: String
  organisationSlug: String
  """
  The processed photos shown as they are, at `/media/listing-photos/<key>/full`: never an ID document's nor an ID-like one.
  """
  photoKeys: [ID!]! @listSize(assumedSize: 5)
  place: PublicPlace!
  publishedAt: DateTime
  status: ListingStatus!
  title: String
}

"""
A page of the search. A query reaches its first 500 results at most
(`hasNextPage` is false past them) whatever `totalCount` says.
"""
type PublicListingConnection {
  counts: ListingCounts!
  edges: [PublicListingEdge!]! @listSize(assumedSize: 50)
  pageInfo: PageInfo!
  """Every open listing the filter matches."""
  totalCount: Int!
}

type PublicListingEdge {
  """Metres from `near`, null without one."""
  distanceM: Int
  node: PublicListing!
}

"""
The place as a visitor sees it: a point blurred to about 110 m unless the item is kept in a public place.
"""
type PublicPlace {
  """
  The town the author gave, the filter `ListingFilter.city` matches; null when none.
  """
  city: String
  keptAt: KeptAt
  """
  Where, in the author's words; null for an item kept with its finder, whose words could name their home, and for an ID document.
  """
  label: String
  point: GeoPoint!
  radiusM: Int
}

type Query {
  """
  The categories of item in tree order (a root, then its children). Public.
  `includeInactive` needs the platform admin, as for `countries`.
  """
  categories(includeInactive: Boolean = false): [Category!]! @listSize(assumedSize: 40)
  """
  The countries the platform serves, by code. Public. `includeInactive` needs the
  platform admin (401, `accounts.errors.suspended` 403, `auth.errors.forbidden` 403).
  """
  countries(includeInactive: Boolean = false): [Country!]! @listSize(assumedSize: 20)
  """One country by code, or null for an unknown or inactive one. Public."""
  country(code: String! @constraint(pattern: "^[A-Z]{2}$")): Country
  """
  Every API error message in a language (the request's language when none is
  given: `Accept-Language`, then `lang`, then the cookie, else French). Public:
  sign-in screens need it, so no viewer is asked for.
  """
  errorCatalogue(language: Language): ErrorCatalogue!
  """
  The `version` of `errorCatalogue(language)`, a cheap read to revalidate a
  cached catalogue. Public.
  """
  errorCatalogueVersion(language: Language): String!
  """
  Places matching a text, through the geocoding provider (cached, one request
  a second). Needs a signed-in, unsuspended account (the public provider is
  spared the anonymous traffic). `config.errors.geocoding-unavailable` (503)
  when the provider does not answer.
  """
  geocode(countryCode: String @constraint(pattern: "^[A-Z]{2}$"), first: Int = 5 @constraint(min: 1, max: 10), query: String! @constraint(minLength: 2, maxLength: 200)): [GeocodeResult!]! @listSize(assumedSize: 10)
  """
  A listing a visitor may read, masked. Public. An unknown, draft, pending,
  closed, expired or removed listing is `listings.errors.listing-not-found` (404).
  """
  listing(id: ID!): PublicListing!
  """
  The open listings of a box, ready to draw: found ones as markers, clustered
  on the server for the zoom (`zoom` 0 to 22, worked out from the box when
  absent), lost ones as circles. Public; counted against the caller's address.
  An empty box (south above north, west east of east) is
  `validation.errors.invalid-input`.
  """
  mapListings(bbox: BoundingBoxInput!, filter: ListingFilter, zoom: Int @constraint(min: 0, max: 22)): ListingMap!
  """
  A listing as its author or its organisation's agents see it. Needs a
  signed-in, unsuspended account; anybody else, and an unknown id, is
  `listings.errors.listing-not-found` (404).
  """
  myListing(id: ID!): Listing!
  """
  The viewer's own listings, newest first, removed ones left out. Needs a
  signed-in, unsuspended account.
  """
  myListings(after: String, first: Int = 20 @constraint(min: 1, max: 100)): ListingConnection!
  """
  An organisation the viewer works in. Needs an agent or an administrator of it:
  401 without a viewer, 403 `accounts.errors.suspended`, and 404
  `organisations.errors.organisation-not-found` for an unknown slug and for an
  organisation the viewer is no member of alike.
  """
  organisation(slug: String! @constraint(minLength: 2, maxLength: 63)): Organisation!
  """
  The members and pending invitations of an organisation, oldest first. Needs an
  administrator of it (403 `auth.errors.forbidden` for an agent; the 401, 403 and
  404 of `organisation`).
  """
  organisationMembers(after: String, first: Int = 20 @constraint(min: 1, max: 100), slug: String! @constraint(minLength: 2, maxLength: 63)): MemberConnection!
  """
  The place at a point, or null where the provider knows none. The same
  guard and refusal as `geocode`.
  """
  reverseGeocode(point: GeoPointInput!): GeocodeResult
  """The safe places, by city, optionally of one country or city. Public."""
  safePlaces(after: String, city: String @constraint(minLength: 1, maxLength: 120), countryCode: String @constraint(pattern: "^[A-Z]{2}$"), first: Int = 20 @constraint(min: 1, max: 100)): SafePlaceConnection!
  """The safe places within a radius of a point, nearest first. Public."""
  safePlacesNear(countryCode: String @constraint(pattern: "^[A-Z]{2}$"), first: Int = 10 @constraint(min: 1, max: 50), point: GeoPointInput!, radiusM: Int = 5000 @constraint(min: 100, max: 100000)): [SafePlaceNear!]! @listSize(assumedSize: 50)
  """
  The open listings a filter matches, in the masked view. Public; counted
  against the caller's address (`throttle.errors.too-many`, 429). Refusals: one
  `validation.errors.invalid-input` for a `dateTo` before `dateFrom` and for a
  cursor (`after`) that is not one this query gave.
  """
  searchListings(after: String, filter: ListingFilter, first: Int = 20 @constraint(min: 1, max: 50), orderBy: ListingOrder = DATE): PublicListingConnection!
  """
  The signed-in account and its roles and organisations; null for an anonymous
  request. A suspended account is still answered, with `suspendedAt` set, so
  the client can tell it. Needs no guard: it reads the caller's own account.
  """
  viewer: Viewer
}

