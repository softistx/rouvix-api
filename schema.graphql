type Listing {
  attributes: ListingAttributes!
  categoryKey: String!
  closedAt: DateTime
  closedReason: CloseReason
  countryCode: String!
  createdAt: DateTime!
  """The day it was lost or found."""
  date: Date!
  description: String!
  documentType: String
  expiresAt: DateTime
  """How many times it was extended, three at most."""
  extendedCount: Int!
  """
  An ID document's holder as visitors see them, first name and last-name initial (`Jean E.`); null when none was read.
  """
  holderHint: String
  id: ID!
  kind: ListingKind!
  """
  An ID document's number as visitors see it, all but its first two characters masked (`99••••••••`); null when none was read.
  """
  maskedNumber: String
  """The slug of the organisation whose register holds it, if any."""
  organisationSlug: String
  photos: [Photo!]! @listSize(assumedSize: 5)
  place: ListingPlace!
  publishedAt: DateTime
  questions: [ListingQuestion!]! @listSize(assumedSize: 3)
  status: ListingStatus!
  title: String!
  updatedAt: DateTime!
