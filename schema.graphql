"""
A member of an organisation, or a person invited to it. The phone number is
masked (`+237••••••••01`): an administrator tells two invitations apart and
learns nothing more; the whole number is its holder's, through `Viewer.account`.
"""
type Member {
  createdAt: DateTime!
  id: ID!
  phoneMasked: String!
  role: OrganisationRole!
  status: MemberStatus!
}

type MemberConnection {
  edges: [MemberEdge!]! @listSize(assumedSize: 100)
  pageInfo: PageInfo!
  totalCount: Int!
}

type MemberEdge {
  node: Member!
}

"""Whether a member has accepted their invitation."""
enum MemberStatus {
  ACTIVE
  INVITED
}

type Mutation {
  """
  Accepts the invitation `token` names, as the account whose phone was invited.
  Needs a signed-in, unsuspended account; an unknown, expired or somebody else's
  token is `organisations.errors.invitation-invalid` (404). Repeating it is harmless.
  """
  acceptMembership(token: String! @constraint(minLength: 40, maxLength: 128)): OrganisationMembership!
  """
  Closes a listing for a reason. An ID document's photos, their blurred copies
  and what the OCR read of it are removed with it.
  Needs the author or an agent; `listings.errors.invalid-status` (409).
  """
  closeListing(id: ID!, reason: CloseReason!): Listing!
  """
  Makes an organisation, its creator becoming its administrator. Needs a signed-in,
  unsuspended account. Refusals: `organisations.errors.slug-reserved` (400, on `slug`: the slug is one of the UI's own routes), `organisations.errors.slug-taken` (409, on `slug`).
  """
  createOrganisation(input: CreateOrganisationInput!): Organisation!
  """
  Adds a safe place. Needs the platform admin. A country that is unknown or
  inactive is `config.errors.country-not-found` (400, on `countryCode`).
  """
  createSafePlace(input: SafePlaceInput!): SafePlace!
  """
  Declares a listing. Needs a signed-in, unsuspended account (an agent of
  `organisationSlug`, else 404 `organisations.errors.organisation-not-found`).
  Refusals: one `validation.errors.invalid-input` listing each field
  (`listings.errors.category-invalid` on `categoryKey`,
  `listings.errors.document-type-invalid` on `documentType`,
  `listings.errors.photo-invalid` on `photoKeys.<i>`, the radius, the
  whereabouts, the questions and the date), `config.errors.country-not-found`.
  """
  declareListing(input: DeclareListingInput!): Listing!
  """
  Archives a safe place, returning its id. Needs the platform admin;
  `config.errors.safe-place-not-found` (404) for an unknown one.
  """
  deleteSafePlace(id: ID!): ID!
  """
  Adds 90 days to an open listing, three times at most
  (`listings.errors.extension-limit` 409). Needs the author or an agent.
  """
  extendListing(id: ID!): Listing!
  """
  Invites a phone number as `role`, or sends a new invitation to a phone already
  invited. Needs an administrator (the refusals of `organisationMembers`); a
  `phone` that is no number is `validation.errors.invalid-format` on `phone`, a
  phone already a member `organisations.errors.already-member` (409). Sends no
  SMS: the token is returned.
  """
  inviteMember(phone: String! @constraint(minLength: 8, maxLength: 24), role: OrganisationRole!, slug: String! @constraint(minLength: 2, maxLength: 63)): InviteMemberPayload!
  """
  Takes a listing down for good, returning its id. Needs the author or an agent.
  """
  removeListing(id: ID!): ID!
  """
  Removes a member or withdraws an invitation, returning the member's id. Needs an
  administrator; the refusals of `setMemberRole`, `last-admin` for the last
  administrator being removed.
  """
  removeMember(memberId: ID!, slug: String! @constraint(minLength: 2, maxLength: 63)): ID!
  """
  Makes or replaces a category (stated whole). Needs the platform admin. A parent
  that is unknown, not a root, the category itself, or of another document-ness
  is `config.errors.category-parent-invalid` on `parent`.
  """
  setCategory(input: CategoryInput!): Category!
  """
  Makes or replaces a country (stated whole). Needs the platform admin (401,
  403 `accounts.errors.suspended`, 403 `auth.errors.forbidden`). A document
  type that is no live document category is `config.errors.document-type-unknown`
  and a pattern that is no regular expression `validation.errors.invalid-format`,
  each on its path of one `validation.errors.invalid-input`.
  """
  setCountry(input: CountryInput!): Country!
  """
  Gives a member a role. Needs an administrator; `organisations.errors.member-not-found`
  (404) for a member of no such organisation, `organisations.errors.last-admin` (409)
  for the last administrator being demoted.
  """
  setMemberRole(memberId: ID!, role: OrganisationRole!, slug: String! @constraint(minLength: 2, maxLength: 63)): Member!
  """
  Replaces a draft, pending or open listing's content under `version`
  (`listings.errors.stale-version` 409 when someone wrote first). `publish`
  takes a draft public. Needs the author or an agent of its organisation;
  `listings.errors.invalid-status` (409) for a listing past editing.
  """
  updateListing(id: ID!, input: ListingContentInput!, publish: Boolean! = false, version: Int!): Listing!
  """
  Replaces a safe place's fields (stated whole). Needs the platform admin; the
  refusals of `createSafePlace`, `config.errors.safe-place-not-found` (404), and,
  with `version`, `config.errors.stale-version` (409) when someone wrote first.
  """
  updateSafePlace(id: ID!, input: SafePlaceInput!, version: Int): SafePlace!
}

